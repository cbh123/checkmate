    <path d="M382 592 L454 653 Q479 676 510 676 L548 676 Q568 676 562 652 L544 576 Z" fill="url(#blue)"/>
    <rect x="326" y="446" width="65" height="132" rx="28" fill="#245EC7"/>
    <path d="M376 398 H621 C705 398 768 446 808 499 Q818 512 808 525 C768 578 705 626 621 626 H376 Q350 626 350 600 V424 Q350 398 376 398Z" fill="url(#shell)"/>
    <path d="M378 402 H621 C698 402 757 443 797 492" stroke="white" stroke-opacity=".8" stroke-width="4" stroke-linecap="round"/>
    <rect x="411" y="455" width="275" height="114" rx="57" fill="#C4D4ED"/>
    <rect x="417" y="461" width="263" height="102" rx="51" fill="#E3EBF9"/>
    <rect x="417" y="461" width="185" height="102" rx="51" fill="url(#blue)"/>
    <path d="M492 486 Q487 483 487 490 V534 Q487 541 492 538 L528 517 Q534 512 528 507Z" fill="white"/>
  </g>
</g>
</svg>
