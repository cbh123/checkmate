<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
<title>Little Loader — a smiling blue progress bar</title>
<defs><filter id="tile-shadow" x="0" y="0" width="1024" height="1024" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
  <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#162039" flood-opacity=".18"/>
  <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#162039" flood-opacity=".08"/>
</filter>
<filter id="object-shadow" x="140" y="180" width="760" height="680" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
  <feDropShadow dx="0" dy="15" stdDeviation="13" flood-color="#164265" flood-opacity=".18"/>
  <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#164265" flood-opacity=".1"/>
</filter>

<linearGradient id="tile" x1="300" y1="100" x2="680" y2="924" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFDF8"/><stop offset="1" stop-color="#EAEFF5"/></linearGradient>
<linearGradient id="track" x1="512" y1="376" x2="512" y2="630" gradientUnits="userSpaceOnUse"><stop stop-color="#CDDAEA"/><stop offset="1" stop-color="#E1EBF6"/></linearGradient>
<linearGradient id="blue" x1="350" y1="394" x2="480" y2="618" gradientUnits="userSpaceOnUse"><stop stop-color="#41B8FF"/><stop offset=".55" stop-color="#148BFA"/><stop offset="1" stop-color="#0670EA"/></linearGradient>
<linearGradient id="shine" x1="420" y1="393" x2="420" y2="609" gradientUnits="userSpaceOnUse"><stop stop-color="white" stop-opacity=".5"/><stop offset=".55" stop-color="white" stop-opacity="0"/></linearGradient></defs>

<rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#tile-shadow)"/>
<rect x="102" y="102" width="820" height="820" rx="183" stroke="white" stroke-opacity=".8" stroke-width="3"/>
<g transform="rotate(-7 512 512)">
  <g filter="url(#object-shadow)">
    <rect x="206" y="380" width="612" height="264" rx="132" fill="#FAFDFF"/>
    <rect x="219" y="393" width="586" height="238" rx="119" fill="url(#track)"/>
    <rect x="220" y="394" width="414" height="236" rx="118" fill="url(#blue)"/>
    <rect x="222" y="396" width="410" height="232" rx="116" stroke="url(#shine)" stroke-width="4"/>
  </g>
  <ellipse cx="466" cy="492" rx="14" ry="20" fill="#063C76"/>
  <ellipse cx="540" cy="492" rx="14" ry="20" fill="#063C76"/>
  <path d="M479 538 Q503 565 527 538" stroke="#063C76" stroke-width="13" stroke-linecap="round"/>
  <ellipse cx="439" cy="532" rx="18" ry="11" fill="#A5E6FF" fill-opacity=".65"/>
  <ellipse cx="566" cy="532" rx="18" ry="11" fill="#A5E6FF" fill-opacity=".65"/>
</g>
</svg>
